[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-shorts-kit"
version = "0.2.0"
description = "YouTube動画制作リポジトリ間で共有する部品(ffmpeg・ラウドネス・検査・VOICEVOX・FreeVideo)"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "numpy>=1.24", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["ytkit*", "ytcore*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
